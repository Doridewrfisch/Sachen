<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>24 · 30 · 60 FPS</title>
<style>
:root{
  --bg1:#07131f; --bg2:#0d3550; --panel:#0f4a63; --stage:#0a2c40; --grid:rgba(127,211,238,.10);
  --line:rgba(127,211,238,.35); --ink:#eef6fb; --accent:#7fd3ee; --floor:#3f87a6;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){:root{color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:radial-gradient(1200px 700px at 20% 0%,var(--bg2),var(--bg1));color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
main{width:100%;max-width:1500px;padding:28px 24px 72px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
@media (max-width:820px){.grid{grid-template-columns:1fr;gap:22px}}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:16px}
.frame{width:100%;padding:8px;border-radius:22px;background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.35)}
canvas{width:100%;height:auto;display:block;border-radius:15px}
figcaption{font-size:clamp(1.3rem,2.2vw,1.9rem);font-weight:600;letter-spacing:.02em;padding:6px 26px;border-radius:12px;border:1px solid var(--line);background:rgba(15,74,99,.65)}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;opacity:.35;transition:opacity .2s}
.bar:hover,.bar:focus-within{opacity:1}
.bar button{font:inherit;font-size:.95rem;min-width:44px;height:38px;padding:0 12px;color:var(--ink);background:rgba(15,74,99,.8);border:1px solid var(--line);border-radius:10px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--accent);color:var(--bg1);border-color:var(--accent)}
.bar button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="grid" id="grid"></div>
</main>
<div class="bar">
  <button id="play" aria-label="Pause" aria-pressed="false">❚❚</button>
  <button id="slow" aria-label="Zeitlupe" aria-pressed="false">0,1×</button>
  <button id="trail" aria-label="Einzelbilder als Spur" aria-pressed="false">●●●</button>
</div>
<script>
(function(){
  var FPS=[24,30,60],W=520,H=400,R=24,FLOOR=H-46;
  var grid=document.getElementById('grid');
  var panels=FPS.map(function(f){
    var fig=document.createElement('figure');
    fig.innerHTML='<div class="frame"><canvas width="'+W+'" height="'+H+'" aria-label="Kugel mit '+f+' FPS"></canvas></div><figcaption>'+f+' FPS</figcaption>';
    grid.appendChild(fig);
    return {fps:f,ctx:fig.querySelector('canvas').getContext('2d'),last:-1};
  });
  var paused=false,slow=false,trail=false,t=0,prev=null;

  function pos(ts){
    var span=W-2*R-40,period=2.0;
    var p=(ts%period)/period*2;
    var x=R+20+(p<=1?p:2-p)*span;
    var b=Math.abs(Math.sin(Math.PI*ts/0.5));
    var y=FLOOR-R-b*(FLOOR-R*2-30);
    return {x:x,y:y,b:b};
  }
  function ball(c,x,y,alpha){
    var g=c.createRadialGradient(x-R*.35,y-R*.4,R*.1,x,y,R);
    g.addColorStop(0,'#ffe0a3');g.addColorStop(.5,'#ffb347');g.addColorStop(1,'#d9731a');
    c.globalAlpha=alpha;c.fillStyle=g;c.beginPath();c.arc(x,y,R,0,6.2832);c.fill();c.globalAlpha=1;
  }
  function draw(p,frame){
    var c=p.ctx,ts=frame/p.fps;
    c.fillStyle='#0a2c40';c.fillRect(0,0,W,H);
    c.strokeStyle='rgba(127,211,238,.10)';c.lineWidth=1;
    c.beginPath();
    for(var gx=0;gx<=W;gx+=40){c.moveTo(gx+.5,0);c.lineTo(gx+.5,H);}
    for(var gy=0;gy<=H;gy+=40){c.moveTo(0,gy+.5);c.lineTo(W,gy+.5);}
    c.stroke();
    c.fillStyle='#3f87a6';c.fillRect(0,FLOOR,W,3);
    var a=pos(ts);
    // Schatten
    c.fillStyle='rgba(0,0,0,.35)';
    var sw=R*(1.1-.5*(1-a.b)*0+ -.5*a.b+.5);
    c.beginPath();c.ellipse(a.x,FLOOR+10,R*(1.2-.5*a.b),5*(1.1-.5*a.b),0,0,6.2832);c.fill();
    if(trail){
      var n=Math.round(p.fps*0.3);
      for(var k=n;k>=1;k--){var q=pos(ts-k/p.fps);ball(c,q.x,q.y,.45*(1-k/(n+1)));}
    }
    ball(c,a.x,a.y,1);
  }
  function loop(now){
    if(prev===null)prev=now;
    var dt=(now-prev)/1000;prev=now;
    if(!paused)t+=dt*(slow?0.1:1);
    panels.forEach(function(p){
      var fr=Math.floor(t*p.fps);
      if(fr!==p.last){p.last=fr;draw(p,fr);}
    });
    requestAnimationFrame(loop);
  }
  function reset(){panels.forEach(function(p){p.last=-1;});}
  var bp=document.getElementById('play'),bs=document.getElementById('slow'),bt=document.getElementById('trail');
  function tp(){paused=!paused;bp.textContent=paused?'▶':'❚❚';bp.setAttribute('aria-label',paused?'Abspielen':'Pause');bp.setAttribute('aria-pressed',paused);}
  function ts(){slow=!slow;bs.setAttribute('aria-pressed',slow);}
  function tt(){trail=!trail;bt.setAttribute('aria-pressed',trail);reset();}
  bp.onclick=tp;bs.onclick=ts;bt.onclick=tt;
  document.addEventListener('keydown',function(e){
    if(e.code==='Space'){e.preventDefault();tp();}
    else if(e.key==='s'||e.key==='S')ts();
    else if(e.key==='t'||e.key==='T')tt();
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
